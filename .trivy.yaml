---
# Configuration of the Trivy scans (.github/workflows/_sbom.yml) and of
# dependency-review-action (.github/workflows/_legal-dependencies.yml).

# Allowed licenses (exact SPDX identifiers) of the distributed Python
# dependencies are classified as notice (LOW severity) and not reported,
# any other license (including unknown ones) fails the license check.
license:
  notice: &allowed-licenses
    - "MIT"
    - "MIT-0"
    - "Apache-2.0"
    - "BSD-2-Clause"
    - "BSD-3-Clause"
    - "ISC"
    - "PSF-2.0"
    - "Python-2.0"
    - "0BSD"
    - "Unlicense"
    - "Zlib"
    - "OFL-1.1"
  # Emptied, these would otherwise be LOW severity (not reported) as well
  # enq: the only way to set an empty list in YAML
  permissive: [] # yamllint disable-line rule:brackets
  # enq: the only way to set an empty list in YAML
  unencumbered: [] # yamllint disable-line rule:brackets

allow-licenses: *allowed-licenses
# Exceptions as package URLs, e.g. pkg:githubactions/<owner>/<repo>
# The dependency graph reports every uv.lock package as runtime (development
# scope requires a virtual project), hence development and template setup
# dependencies are listed here
allow-dependencies-licenses:
  # MPL-2.0, tooling and template setup dependency (not distributed)
  - "pkg:pypi/certifi"
  # MPL-2.0, dev-tests group (not distributed)
  - "pkg:pypi/hypothesis"
  # MIT-CMU, dev-docs group (not distributed)
  - "pkg:pypi/wcwidth"
  # MPL-2.0 (with MIT and BSD-3-Clause), dev-pyproject group (not distributed)
  - "pkg:pypi/validate-pyproject"
  # MPL-2.0, hatchling extra (unmodified, distributed as a separate package,
  # see .trivyignore.yaml), also dev-yaml group (yamllint)
  - "pkg:pypi/pathspec"
  # LGPL-3.0-or-later, dev-docs group (not distributed)
  - "pkg:pypi/cairosvg"
  # MIT-CMU, dev-docs group (not distributed)
  - "pkg:pypi/pillow"
  # GPL-2.0, dev-text group (not distributed)
  - "pkg:pypi/codespell"
  # MPL-2.0, dev-github and dev-citation groups via jsonschema (not distributed)
  - "pkg:pypi/fqdn"
  # MIT AND MPL-2.0, dev-github and dev-citation groups via jsonschema
  # (not distributed)
  - "pkg:pypi/lark"
  # Apache-2.0 AND GPL-1.0-or-later AND MIT, dev-github and dev-citation
  # groups via jsonschema (not distributed)
  - "pkg:pypi/rfc3987-syntax"
  # GPL-2.0-only (with linking exception), dev-security group via guarddog
  # (not distributed)
  - "pkg:pypi/pygit2"
  # PSF-2.0 (misreported by the dependency graph), dev-security group
  # via guarddog (not distributed)
  - "pkg:pypi/typing-extensions"
  # GPL-3.0-only, dev-ini group (not distributed)
  - "pkg:pypi/pyinilint"
  # MPL-2.0, dev-tests group (not distributed)
  - "pkg:pypi/pytest-html"
  # MPL-2.0, dev-tests group via pytest-html (not distributed)
  - "pkg:pypi/pytest-metadata"
  # GPL-3.0-or-later (with Apache-2.0, CC-BY-SA-4.0 and CC0-1.0), dev-legal
  # and dev-release groups (not distributed)
  - "pkg:pypi/reuse"
  # GPL-2.0-or-later, dev-legal and dev-release groups via reuse
  # (not distributed)
  - "pkg:pypi/python-debian"
  # Apache-2.0 AND GPL-2.0-only, dev-release group (not distributed)
  - "pkg:pypi/spdx-tools"
  # GPL-3.0-or-later, dev-yaml group (not distributed)
  - "pkg:pypi/yamllint"
...
