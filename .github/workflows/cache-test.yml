---
name: "Cache Test"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/actions/uv-setup/action.yml"
      - ".github/workflows/cache-test.yml"
      - ".github/workflows/_cache.yml"
      - ".github/workflows/_cache-run.yml"
      - "project/**"
  merge_group:
    types:
      - "checks_requested"
  workflow_dispatch:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

jobs:
  cache-test:
    name: "Cache Test"
    permissions:
      contents: "read"
    # enq: pinned template reference (<repo>/<path>@<sha>) cannot be broken
    # yamllint disable rule:line-length
    uses: "open-nudge/opentemplate/.github/workflows/_cache.yml@a883a2557fb144a77b8e11c9a5d3e278807960d3"
    # yamllint enable rule:line-length
...
