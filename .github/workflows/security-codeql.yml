---
name: "Security CodeQL"

on:
  pull_request:
    branches:
      - "main"
  merge_group:
    types:
      - "checks_requested"
  push:
    branches:
      - "main"
  workflow_dispatch:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-codeql:
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "read" # Needed by CodeQL init and analyze (no upload)
      contents: "read"
    name: "Security CodeQL"
    # enq: pinned template reference (<repo>/<path>@<sha>) cannot be broken
    # yamllint disable rule:line-length
    uses: "open-nudge/opentemplate/.github/workflows/_security-codeql.yml@a883a2557fb144a77b8e11c9a5d3e278807960d3"
    # yamllint enable rule:line-length
    with:
      name: "codeql"

  # Separate job, so PRs (which do not upload) run without write permissions
  security-codeql-upload:
    name: "Security CodeQL Upload"
    needs: "security-codeql"
    # Also on failure (findings), digests are empty if CodeQL was skipped
    # (see _security-codeql.yml) or produced no SARIF
    if: >
      !cancelled()
      && needs.security-codeql.outputs.digests != ''
      && github.event_name != 'pull_request'
      && github.event_name != 'merge_group'
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
    # enq: pinned template reference (<repo>/<path>@<sha>) cannot be broken
    # yamllint disable rule:line-length
    uses: "open-nudge/opentemplate/.github/workflows/_security-upload.yml@a883a2557fb144a77b8e11c9a5d3e278807960d3"
    # yamllint enable rule:line-length
    with:
      name: "codeql"
      category: "/tool:codeql/scope:workflows/language:actions"
...
