---
name: "GitHub"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/*.yml"
      - ".github/actions/*/action.yml"
      - ".github/actions/uv-setup/action.yml"
  merge_group:
    types:
      - "checks_requested"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

jobs:
  github:
    name: "GitHub"
    permissions:
      contents: "read"
    # enq: pinned template reference (<repo>/<path>@<sha>) cannot be broken
    # yamllint disable rule:line-length
    # enq: temporary, opentemplate main commits are untagged (no release yet)
    uses: "open-nudge/opentemplate/.github/workflows/_github.yml@3cf3b510a4d056c4c12719ea59eb71003a21ae70" # zizmor: ignore[stale-action-refs]
    # yamllint enable rule:line-length
...
