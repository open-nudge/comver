---
name: "Security SBOM Python"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".trivy.yaml"
      - ".trivyignore.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security-sbom-python.yml"
      - ".github/workflows/_security-sbom-python.yml"
      - ".github/workflows/_sbom.yml"
  merge_group:
    types:
      - "checks_requested"
# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-sbom-python:
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
      contents: "read"
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
    name: "Security SBOM Python"
    # enq: pinned template reference (<repo>/<path>@<sha>) cannot be broken
    # yamllint disable rule:line-length
    # enq: temporary, opentemplate main commits are untagged (no release yet)
    uses: "open-nudge/opentemplate/.github/workflows/_security-sbom-python.yml@a883a2557fb144a77b8e11c9a5d3e278807960d3" # zizmor: ignore[stale-action-refs]
    # yamllint enable rule:line-length
...
