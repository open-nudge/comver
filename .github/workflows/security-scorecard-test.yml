---
name: "Security Scorecard Test"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/security-scorecard-test.yml"
      - ".github/workflows/_security-scorecard.yml"
  merge_group:
    types:
      - "checks_requested"
  workflow_dispatch:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

jobs:
  security-scorecard-test:
    name: "Security Scorecard Test"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
      id-token: "write" # Needed for GitHub OIDC token if publish_results
      contents: "read"
    # enq: pinned template reference (<repo>/<path>@<sha>) cannot be broken
    # yamllint disable rule:line-length
    # enq: temporary, opentemplate main commits are untagged (no release yet)
    uses: "open-nudge/opentemplate/.github/workflows/_security-scorecard.yml@a883a2557fb144a77b8e11c9a5d3e278807960d3" # zizmor: ignore[stale-action-refs]
    # yamllint enable rule:line-length
...
