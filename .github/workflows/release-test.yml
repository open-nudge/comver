---
name: "Release Test"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".trivy.yaml"
      - ".trivyignore.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/actions/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-test.yml"
      - ".github/workflows/_release*.yml"
      - ".github/workflows/_security-*.yml"
      - ".github/workflows/security-sbom-*.yml"
      - ".github/workflows/_sbom.yml"
      - ".github/workflows/_tests.yml"
      - ".github/workflows/_run.yml"
  workflow_dispatch:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Attestation permissions are granted as GitHub validates nested jobs
  # permissions upfront, even for skipped jobs
  release-test:
    name: "Release Test"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to security tab
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
      contents: "read"
      pull-requests: "read" # Needed to read PR metadata during changelog gen
    # enq: pinned template reference (<repo>/<path>@<sha>) cannot be broken
    # yamllint disable rule:line-length
    # enq: temporary, opentemplate main commits are untagged (no release yet)
    uses: "open-nudge/opentemplate/.github/workflows/_release.yml@a883a2557fb144a77b8e11c9a5d3e278807960d3" # zizmor: ignore[stale-action-refs]
    # yamllint enable rule:line-length
    with:
      upload-sarif: false
...
