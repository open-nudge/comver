---
name: "_JSON5"

on:
  workflow_call:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  _json5:
    name: "_JSON5"
    permissions:
      contents: "read"
    # enq: pinned template reference (<repo>/<path>@<sha>) cannot be broken
    # yamllint disable rule:line-length
    # enq: temporary, opentemplate main commits are untagged (no release yet)
    uses: "open-nudge/opentemplate/.github/workflows/_run-check.yml@a883a2557fb144a77b8e11c9a5d3e278807960d3" # zizmor: ignore[stale-action-refs]
    # yamllint enable rule:line-length
    with:
      check: "json5"
      arguments: "$(find -path '*.json5')"
      group: "json5"
      sparse-checkout: |
        prek.toml
        **.json5
...
