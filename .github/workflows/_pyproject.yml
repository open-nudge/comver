---
name: "_pyproject"

on:
  workflow_call:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  _pyproject:
    name: "_pyproject"
    permissions:
      contents: "read"
    # enq: pinned template reference (<repo>/<path>@<sha>) cannot be broken
    # yamllint disable rule:line-length
    uses: "open-nudge/opentemplate/.github/workflows/_run-check.yml@a883a2557fb144a77b8e11c9a5d3e278807960d3"
    # yamllint enable rule:line-length
    with:
      check: "pyproject"
...
