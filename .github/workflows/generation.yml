---
name: "Generation"

on:
  pull_request:
    branches:
      - "main"
  merge_group:
    types:
      - "checks_requested"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

concurrency:
  cancel-in-progress: true
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}

jobs:
  generation:
    name: "Generation"
    permissions:
      contents: "read"
    # enq: pinned template reference (<repo>/<path>@<sha>) cannot be broken
    # yamllint disable rule:line-length
    uses: "open-nudge/opentemplate/.github/workflows/_generation.yml@a883a2557fb144a77b8e11c9a5d3e278807960d3"
    # yamllint enable rule:line-length
...
