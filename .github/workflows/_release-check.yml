---
# enq: reusable workflows offload concurrency limits to the caller
name: "_Release Check"  # zizmor: ignore[concurrency-limits]

on:
  workflow_call:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  _release-check:
    name: "_Release Check"
    permissions:
      contents: "read"
    # enq: pinned template reference (<repo>/<path>@<sha>) cannot be broken
    # yamllint disable rule:line-length
    # enq: temporary, opentemplate main commits are untagged (no release yet)
    uses: "open-nudge/opentemplate/.github/workflows/_run-check.yml@3cf3b510a4d056c4c12719ea59eb71003a21ae70" # zizmor: ignore[stale-action-refs]
    # yamllint enable rule:line-length
    with:
      check: "release"
      full-checkout: true

  _release-check-build:
    name: "_Release Check Build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    permissions:
      contents: "read"
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c" # v2.23.0
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            codeload.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            results-receiver.actions.githubusercontent.com:443
      - name: "Checkout source"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          path: "source"
          fetch-depth: 0
          persist-credentials: false
      - name: "Build distributions"
        # enq: pinned template reference (<repo>/<path>@<sha>) cannot be broken
        # yamllint disable rule:line-length
        # enq: temporary, opentemplate main commits are untagged (no release yet)
        uses: "open-nudge/opentemplate/.github/actions/dist-build@3cf3b510a4d056c4c12719ea59eb71003a21ae70" # zizmor: ignore[stale-action-refs]
        # yamllint enable rule:line-length
...
