---
# enq: reusable workflows offload concurrency limits to the caller
name: "_Release SBOMs"  # zizmor: ignore[concurrency-limits]

on:
  workflow_call:
    inputs:
      digests:
        description: "sha256sum of the distributions (release build output)"
        type: "string"
        required: true
      upload-sarif:
        description: "Upload the Trivy SARIFs to Security tab"
        type: "boolean"
        default: true

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  sbom:
    name: "SBOM (${{ matrix.type }})"
    strategy:
      fail-fast: true
      matrix:
        type:
          - "legal"
          - "actions"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
      contents: "read"
      attestations: "write" # Needed to verify and upload attestation
      id-token: "write" # Needed to get GH Token to attest
      artifact-metadata: "write" # Needed to create artifact metadata
    # enq: pinned template reference (<repo>/<path>@<sha>) cannot be broken
    # yamllint disable rule:line-length
    # enq: temporary, opentemplate main commits are untagged (no release yet)
    uses: "open-nudge/opentemplate/.github/workflows/_sbom.yml@a883a2557fb144a77b8e11c9a5d3e278807960d3" # zizmor: ignore[stale-action-refs]
    # yamllint enable rule:line-length
    with:
      type: "${{ matrix.type }}"
      digests: "${{ inputs.digests }}"
      upload-sarif: "${{ inputs.upload-sarif }}"

  sbom-python:
    name: "SBOM Python"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
      contents: "read"
      attestations: "write" # Needed to verify and upload attestation
      id-token: "write" # Needed to get GH Token to attest
      artifact-metadata: "write" # Needed to create artifact metadata
    # enq: pinned template reference (<repo>/<path>@<sha>) cannot be broken
    # yamllint disable rule:line-length
    # enq: temporary, opentemplate main commits are untagged (no release yet)
    uses: "open-nudge/opentemplate/.github/workflows/_security-sbom-python.yml@a883a2557fb144a77b8e11c9a5d3e278807960d3" # zizmor: ignore[stale-action-refs]
    # yamllint enable rule:line-length
    with:
      digests: "${{ inputs.digests }}"
      upload-sarif: "${{ inputs.upload-sarif }}"
...
