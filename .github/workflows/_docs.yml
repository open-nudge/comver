---
name: "_Docs"

on:
  workflow_call:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  _docs:
    name: "_Docs"
    permissions:
      contents: "read"
    # enq: pinned template reference (<repo>/<path>@<sha>) cannot be broken
    # yamllint disable rule:line-length
    uses: "open-nudge/opentemplate/.github/workflows/_run.yml@a883a2557fb144a77b8e11c9a5d3e278807960d3"
    # yamllint enable rule:line-length
    with:
      command: |
        uv run poe check-docs
      group: "docs"
      core: true
      fetch-depth: 0
      sparse-checkout: |
        **.md
        **.py
        mkdocs.yml
      additional-allowed-endpoints: >
        fonts.google.com:443
        fonts.gstatic.com:443
...
