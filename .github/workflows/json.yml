---
name: "JSON"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "**.json"
      - ".github/actions/uv-setup/action.yml"
      - ".github/workflows/json.yml"
      - ".github/workflows/_json.yml"
      - ".github/workflows/_run-check.yml"
      - ".github/workflows/_run.yml"
  merge_group:
    types:
      - "checks_requested"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  json:
    name: "JSON"
    permissions:
      contents: "read"
    # enq: pinned template reference (<repo>/<path>@<sha>) cannot be broken
    # yamllint disable rule:line-length
    # enq: temporary, opentemplate main commits are untagged (no release yet)
    uses: "open-nudge/opentemplate/.github/workflows/_json.yml@a883a2557fb144a77b8e11c9a5d3e278807960d3" # zizmor: ignore[stale-action-refs]
    # yamllint enable rule:line-length
...
